name: Downgrade
on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  downgrade:
    name: "Downgrade"
    # The downgrade action discards URL sources. Restore this job after the
    # StochasticDiffEqCore branch for JumpProcesses 10 is released and the
    # temporary pin is removed.
    if: ${{ false }}
    uses: "SciML/.github/.github/workflows/downgrade.yml@v1"
    with:
      group: All
    secrets: "inherit"
