name: "Run Tests"
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch || github.ref != 'refs/tags/v*' }}

jobs:
  tests:
    uses: "SciML/.github/.github/workflows/grouped-tests.yml@v1"
    with:
      # Nothing uses the coverage reports, and instrumenting JumpProcesses' code slows it
      # 2-5x in the tests. Bounds checking stays on (the default) to catch @inbounds errors.
      coverage: false
    secrets: "inherit"
