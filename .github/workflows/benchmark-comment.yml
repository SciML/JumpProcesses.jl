name: Benchmark Comment

# Posts the tables of "Benchmark this PR" as a comment on its pull request. That workflow runs
# the pull request's code with a read-only token for pull requests from forks, so it can't
# comment there. This one runs from the default branch with a token that can, never runs the
# pull request's code, and only reads the uploaded files as data.
on:
  workflow_run:
    workflows: ["Benchmark this PR"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-results-*
          path: results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the comment
        id: comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The PR number comes from the artifact, since GitHub leaves the run's pull_requests
          # empty for forks. Use it only if that PR's head is the benchmarked commit; a newer
          # push gets its own run and comment.
          pr=$(cat results/*/pr_number | head -n 1 | head -c 20 | tr -cd '0-9')
          if [ -z "$pr" ]; then
            echo "No PR number in the artifacts"
            exit 1
          fi
          head=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "PR #$pr is at $head, not the benchmarked $HEAD_SHA; not commenting"
            echo "pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "<!-- benchmark-results -->"
            for f in results/benchmark-results-*/body.md; do
              cat "$f"
              echo
            done
          } | head -c 60000 > comment.md
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
      - name: Create or update the comment
        if: steps.comment.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.comment.outputs.pr }}
        run: |
          # this workflow's earlier comment on the PR, found by its first line
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- benchmark-results -->"))) | .id' |
            head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
