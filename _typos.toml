[default]
# Two-letter names, such as the affects `ab!` and `ba!` of an A <--> B test problem, are not
# misspellings
extend-ignore-identifiers-re = ["^[A-Za-z]{2}$"]

[default.extend-words]
# Surname of an author cited in the SortingDirect references (McCollum et al.)
Collum = "Collum"
# Name of the LambaEM integrator from OrdinaryDiffEq
Lamba = "Lamba"
# Internal function name resetted_jump_problem
resetted = "resetted"
# "IMA J Numer Anal" journal abbreviation in a citation
Numer = "Numer"
# "SIAM J. Sci. Stat. Comput." journal abbreviation in a citation
Comput = "Comput"
# setp from SymbolicIndexingInterface
setp = "setp"
