name: Benchmark this PR

on:
  pull_request:
    branches: [master]
    paths-ignore: ['docs/**']

permissions:
  pull-requests: write
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ["1", "lts"]
    env:
      # Force consistent Julia depot path for self-hosted runners
      JULIA_DEPOT_PATH: ~/.julia
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: ${{ matrix.version }}
          script: "benchmark/benchmarks.jl"
          extra-pkgs: "StableRNGs,OrdinaryDiffEqTsit5,StochasticDiffEqHighOrder"
          job-summary: true
      # This workflow can't comment on pull requests from forks, which get a read-only token.
      # Benchmark Comment posts the tables the action wrote to body.md, with the PR number.
      - name: Save the PR number
        run: echo "${{ github.event.pull_request.number }}" > pr_number
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.version }}
          path: |
            body.md
            pr_number
          retention-days: 1
