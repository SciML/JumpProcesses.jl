name: Benchmark this PR

on:
  pull_request:
    branches: [master]
    paths-ignore: ['docs/**']

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ["1", "lts"]
    env:
      # Force consistent Julia depot path for self-hosted runners
      JULIA_DEPOT_PATH: ~/.julia
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: ${{ matrix.version }}
          script: "benchmark/benchmarks.jl"
          extra-pkgs: "StableRNGs,OrdinaryDiffEqTsit5,StochasticDiffEqHighOrder"
          job-summary: true
          # Time with Julia's default bounds checking, as users run it (@inbounds respected),
          # never with the tests' --check-bounds=yes
          exeflags: "--check-bounds=auto"
      # This workflow can't comment on pull requests from forks, which get a read-only token.
      # Benchmark Comment renders the comment from the results files the action wrote.
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.version }}
          path: results/*.json
          if-no-files-found: error
          retention-days: 1
