[InterfaceI]
# Restore "lts" when the temporary StochasticDiffEq pins are removed: Julia 1.10
# ignores [sources], and registered StochasticDiffEq packages do not admit
# JumpProcesses 10, so the test environment cannot resolve.
versions = ["1", "pre"]

["InterfaceI 32-bit"]
group = "InterfaceI"
versions = ["1"]
os = ["ubuntu-latest"]
arch = "x86"

[InterfaceII]
# Restore "lts" when the temporary StochasticDiffEq pins are removed: Julia 1.10
# ignores [sources], and registered StochasticDiffEq packages do not admit
# JumpProcesses 10, so the test environment cannot resolve.
versions = ["1", "pre"]

[QA]
versions = ["lts", "1"]
